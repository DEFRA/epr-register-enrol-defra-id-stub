# Runs the stub on its own at http://localhost:3200, seeded with the local
# users in data/local/users.json. Point the Operator Journey frontend at
# http://localhost:3200/.well-known/openid-configuration.
services:
  epr-register-enrol-defra-id-stub:
    build:
      context: ./
      target: development
    ports:
      - '3200:3000'
    environment:
      PORT: 3000
      NODE_ENV: development
      STUB_EXTERNAL_URL: http://localhost:3200
      USERS_FILE_PATH: ./data/local/users.json
